[project]
name = "gtfs-zone-feed-catalog"
version = "0.2.2"
requires-python = ">=3.13"
description = "Dagster pipeline that inventories the world of GTFS feeds and publishes the catalog"
license = "AGPL-3.0-or-later"
dependencies = [
    "dagster>=1.9",
    "dagster-webserver>=1.9",
    "dagster-postgres>=0.25",
    "httpx>=0.27",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg2-binary>=2.9",
    "gtfs-zone-db-models",
    "boto3>=1.35",
    "botocore>=1.35",
]

[tool.uv.sources]
gtfs-zone-db-models = { git = "https://github.com/gtfs-zone/gtfs-zone-db-models.git", tag = "v0.2.0" }

[dependency-groups]
dev = [
    "commitizen",
    "deptry>=0.25.1",
    "moto[s3]>=5.0",
    "pytest>=8.0",
    "respx>=0.21",
    "ruff",
    "vulture>=2.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gtfs_zone_feed_catalog"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "TC", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests take fixtures by name and return nothing worth annotating.
"tests/**" = ["ANN"]
# Dagster resolves an asset's upstream dependencies from its parameter
# annotations at import time, so a name only imported under TYPE_CHECKING is a
# NameError when the code server loads the module, not a saved import.
"src/gtfs_zone_feed_catalog/assets/*.py" = ["TC001"]
# Alembic calls include_object with a fixed positional signature of its own.
"src/gtfs_zone_feed_catalog/alembic/env.py" = ["ANN001"]

[tool.vulture]
paths = ["src"]
# ORM columns and Alembic revisions are read by SQLAlchemy and Alembic
exclude = ["*/history/models.py", "*/alembic/versions/*"]
# Used only through a framework: routes, validators, tasks, ORM fields
ignore_decorators = ["@app.*", "@router.*", "@field_validator", "@model_validator", "@asset"]
ignore_names = ["cls", "model_config", "defs", "last_checked", "download_url"]

[tool.deptry]
per_rule_ignores.DEP002 = [
    "dagster-webserver",  # serves the UI, run by the infra deployment
    "dagster-postgres",  # run storage, named in the infra dagster.yaml
    "psycopg2-binary",  # SQLAlchemy driver, loaded from the database URL
]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true
bump_message = "chore(release): bump version $current_version -> $new_version"
annotated_tag = true
pre_bump_hooks = [
    "bash -c 'branch=$(git branch --show-current); [ \"$branch\" = \"main\" ] || { echo \"Error: cz bump must be run on main (currently on \\\"$branch\\\")\"; exit 1; }'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
