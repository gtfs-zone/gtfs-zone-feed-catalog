name: Build

# Lints and tests, builds the image and pushes it to ghcr.io/<owner>/<repo>
# tagged with the short SHA, latest, and the tag on v*. Then records the digest
# in gtfs-zone-infra, which ArgoCD rolls out.
#
# Requires:
#   Secrets:
#     INFRA_DEPLOY_KEY - private half of a write deploy key on gtfs-zone-infra

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

env:
  SITE_DIR: gtfs
jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # uv fetches its own interpreter when the runner's python does not match
      # requires-python.
      - name: Install project
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      # Not every repo has a test suite yet.
      - name: Test
        run: |
          if [ -d tests ]; then
            uv run pytest
          else
            echo "no tests/ directory, skipping"
          fi

      - name: Image tags
        id: tags
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY}"
          SHA="${GITHUB_SHA::7}"
          TAGS="$IMAGE:$SHA,$IMAGE:latest"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAGS="$TAGS,$IMAGE:$GITHUB_REF_NAME"
          fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}

      - name: Load infra deploy key
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.INFRA_DEPLOY_KEY }}

      - name: Record digest in gtfs-zone-infra
        env:
          IMAGE: ${{ steps.tags.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          REF: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.tags.outputs.sha }}
        run: |
          git clone --depth 1 git@github.com:gtfs-zone/gtfs-zone-infra.git /tmp/infra
          cd "/tmp/infra/${SITE_DIR}"
          kustomize edit set image "${IMAGE}=${IMAGE}@${DIGEST}"
          cd /tmp/infra
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${SITE_DIR}/kustomization.yaml"
          git commit -m "deploy(feed-catalog): feed-catalog ${REF}"
          # Concurrent releases race on the same file; rebase and retry rather
          # than failing the release.
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
